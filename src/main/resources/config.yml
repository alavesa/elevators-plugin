# BetterModel integration: when the BetterModel plugin is installed, cabin .bbmodel files are mirrored into
# plugins/BetterModel/models (prefix elevator_) so BetterModel builds the one resource pack, and cabins are rendered
# + animated by BetterModel: animations named "open" / "close" drive the doors, "move" loops while travelling.
# Set enabled: false to keep the built-in exporter and ItemDisplay cabins.
bettermodel:
  enabled: true
  # Extra cabin yaw (degrees) under BetterModel. BetterModel turns every model 180 degrees itself (Blockbench north =
  # front); the plugin already compensates so cabins face as they did before - set 180 here if one comes out backwards.
  yaw-offset: 0

# Elevators - configuration. Types live in types.yml, elevator instances in elevators.yml.

pack:
  # Item whose model is replaced per custom_model_data string. Any item works; pick one players never hold.
  base-item: turtle_scute
  namespace: elevators
  description: "Elevator cabins and buttons (generated by the Elevators plugin)"
  # pack.mcmeta range. 46 = 1.21.4; the client accepts the pack as long as its format is inside the range.
  min-format: 46
  max-format: 999
  # MESH elements in a .bbmodel: fail (the model is not exported, error in the report) or bounding-box.
  mesh-policy: fail
  # A texture that is neither embedded nor found next to the model: fail or warn (renders purple).
  missing-texture: fail
  # Export the pack automatically when the plugin starts (asynchronously).
  export-on-start: true

ride:
  # Y offset of the invisible seat that carries riders, relative to the cabin floor. Riders should stand
  # on the cabin floor: if they float, lower it; if they sink into the floor, raise it.
  seat-offset: 0.0
  # Client-side interpolation of the cabin / seat movement in ticks (1 = smooth, 0 = snap).
  teleport-duration: 1
  # How many blocks below a rider's exit spot to look for solid ground before falling back to the origin.
  safe-exit-search: 3
  # Refuse to travel to a floor whose cabin volume contains solid blocks.
  obstruction-check: true
  # Riders cannot leave their seat (shift) while the cabin moves.
  lock-riders-while-moving: true

buttons:
  # Ignore a second click on the same button within this many ticks (the client sends two packets per click).
  debounce-ticks: 3
  # Default interaction hit box (blocks) for new buttons.
  default-size: 0.4
  # Scale of the floating text label.
  label-scale: 0.5

messages:
  prefix: "&8[&6Elevator&8] &r"
